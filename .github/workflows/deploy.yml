# ============================================================
# BUSARA INFRASTRUCTURE & TECHNOLOGY LABS
# GitHub Actions CI/CD Pipeline — busaralabs.com
# ============================================================
#
# BRANCH STRATEGY:
#   pull_request to main or staging → validate only
#   push to feature/**              → validate only
#   push to staging                 → validate + deploy preview
#   push to main                    → validate + deploy production
#
# This file does not create a manual approval gate. GitHub
# environment protection is a console setting. See
# docs/security/DEPLOYMENT-GATES.md. As of 2026-10-22 the
# environments had no protection rules.
#
# SECRETS (names only, environment-scoped, no shared fallback):
#   staging job:    STAGING_CLOUDFLARE_API_TOKEN
#                   STAGING_CLOUDFLARE_ACCOUNT_ID
#   production job: PRODUCTION_CLOUDFLARE_API_TOKEN
#                   PRODUCTION_CLOUDFLARE_ACCOUNT_ID
# Do not also define CLOUDFLARE_API_TOKEN at repository level.
# A missing environment secret must fail the job.
# ============================================================

name: Busara Labs Website CI/CD

on:
  push:
    branches:
      - main
      - staging
      - "feature/**"
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks v8.30.1
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -O /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Secret scanning — git history
        run: /tmp/gitleaks detect --source . --redact --exit-code 1

      - name: Secret scanning — working directory
        run: /tmp/gitleaks detect --source . --no-git --redact --exit-code 1

      - name: Check for unresolved placeholders
        run: |
          if grep -r "REPLACE_WITH_" \
            --include="*.js" \
            --include="*.ts" \
            --include="*.toml" \
            --include="*.json" \
            --include="*.html" \
            --include="*.css" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            .; then
            echo "ERROR: Unresolved placeholders found."
            exit 1
          fi

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - name: Build assets
        run: node build.js

      - name: Verify build output
        run: |
          test -f assets/js/main.bundle.js
          test -f public/index.html
          node scripts/assert-public-artifact.js public

      - name: Test
        run: npm test

  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.busaralabs.com
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: node build.js

      - name: Refuse a non-public artifact
        run: node scripts/assert-public-artifact.js public

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=busaralabs-website --branch=staging

      - name: Smoke test — staging canonical host only
        run: |
          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "busara-deploy-smoke" https://staging.busaralabs.com/)
          TOML_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "busara-deploy-smoke" https://staging.busaralabs.com/wrangler.toml)
          DOC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "busara-deploy-smoke" https://staging.busaralabs.com/HANDOVER.md)
          echo "home=$HOME_STATUS wrangler=$TOML_STATUS handover=$DOC_STATUS"
          test "$HOME_STATUS" = "200"
          test "$TOML_STATUS" != "200"
          test "$DOC_STATUS" != "200"

  deploy-production:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://busaralabs.com
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: node build.js

      - name: Refuse a non-public artifact
        run: node scripts/assert-public-artifact.js public

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=busaralabs-website --branch=main

      - name: Smoke test — production canonical host only
        run: |
          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "busara-deploy-smoke" https://busaralabs.com/)
          TOML_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "busara-deploy-smoke" https://busaralabs.com/wrangler.toml)
          DOC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "busara-deploy-smoke" https://busaralabs.com/HANDOVER.md)
          echo "home=$HOME_STATUS wrangler=$TOML_STATUS handover=$DOC_STATUS"
          test "$HOME_STATUS" = "200"
          test "$TOML_STATUS" != "200"
          test "$DOC_STATUS" != "200"
